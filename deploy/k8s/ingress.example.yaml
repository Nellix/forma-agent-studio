# Optional: replace the host, ingress class, and TLS secret before applying.
# Also configure PUBLIC_ORIGIN=https://studio.example.internal,
# COOKIE_SECURE=true, and TRUST_PROXY_HOPS for your trusted ingress topology.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studio
  namespace: agent-studio
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [studio.example.internal]
      secretName: studio-tls
  rules:
    - host: studio.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studio
                port:
                  number: 80
